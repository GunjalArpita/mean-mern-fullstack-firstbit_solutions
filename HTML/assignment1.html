<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>input</title>
    <script>
        function show()
        {   
            var u = document.getElementById("uname").value
            var p = document.getElementById("upass").value
            alert("welcome" + u + ".  the password you have entered is " +p)
        }
    </script>
</head>
<body>
    <label for="uname">enter user name</label>
    <input type="text" id ="uname">
<br>
<br>
    <label for="upass">enter password</label>
    <input type="password" id ="upass">

<br>
<br>
    <button onclick="show()">click me </button>
</body>
</html>
