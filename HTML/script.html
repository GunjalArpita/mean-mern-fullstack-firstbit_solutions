<!DOCTYPE html>
<html lang="en">
<head>
<body>
    <title>Subscript and Superscript</title>
</head>
<body>
    <h3>subscript</h3>
    <!--this is a subscript for displaying element at lower side-->
   <!-- for eg.  co2  -->
    co<sub>2</sub>    
    <br>

    <h3>superscrprt</h3>
    <!--this is a superscript for displaying elements at upper side-->
    <!--for eg.   a2+b2=2ab-->
    a<sup>2</sup>+b<sup>2</sup>+2ab
</body>
</html>
