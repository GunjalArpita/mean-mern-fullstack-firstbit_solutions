
<!DOCTYPE html>
<html lang="en">
<head>
<title>Document</title>
<style>
section
{
    background-image: linear-gradient(-225deg,#ee42c6 0%,#6119b3 100%);
    height: 750px;
}
.card
{   
    margin-top: 80px;
    border-radius: 5px;
    background-image: linear-gradient(180deg,#02f789 0%,#049bf9);
}
</style>
</head>
<link rel="stylesheet" href="./web.html">
<link rel="stylesheet" href="./bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.css">
<body>
<section id="login"> 
<div class="container h=100">
  <div class="row justify-content-center align-items-center h-100">
   <div class="col col-xl-9">
    <div class="card">
     <div class="row ">
      <div class="col-md-6 col-lg-6 align-items-center">
        <div class="card-body p-4 p-lg-5 text-black">
          <form >
           <div class="d-flex align-items-center mb-3 pb-1">
              <i class="fas fa-cubes fa-2x me-3  " style="color: orange;"></i>
                <span class="h1 fw-bold mb-0">Signup</span>
            </div>
              <h5 class="fw-normal mb-3 pb-2" style="letter-spacing: 1px;">Signup into your account</h5>
                <div class="form-outline mb-2" >
                  <label class="form-label"> Name</label>
                    <input type="text" class="form-control form-control-lg" placeholder="Enter Your Name" >
                  </div>
                  <div class="form-outline mb-2" >
                    <label class="form-label">Email Address</label>
                      <input type="email" class="form-control form-control-lg" placeholder="Enter Your Email id" >
                  </div>
                   <div class="form-outline mb-2" >
                    <label class="form-label"> Password</label>
                      <input type="password" class="form-control form-control-lg" placeholder="Enter Your Password" >
                  </div>
                  <div class="pt-1 mb-3 text-center">
                    <button class="btn btn-success" type="buttton" >Login</button>
                  </div>
                  <p class="mt-5 pb-lg-2"> Already have an Account?
                    <a  style="color: black; cursor: pointer; font-weight:700;">Login here</a>
                  </p>
            </form>
          </div> 
         </div>
        </div>
      </div>
     </div>
    </div>
  </div>
</div>
</div>
 </section>
 </body>
 </html>
