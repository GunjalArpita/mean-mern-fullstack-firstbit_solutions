<!DOCTYPE html>
<html lang="en">
<head>
   <!--incomplete and self-->
    <title>Position</title>
    <style>
        h1{
            
            position: fixed;
            border: 2px solid;
            left: 5px;
        }
        h2{
            position: relative;
            bottom: 1px;
            left: 300px;
            top: 10px;
        }
        .container{
            /*background-color: aquamarine;*/
        }
        .class1
        {  
            position: absolute;
            
             background-color: aquamarine;
            padding: 50px;
            margin: 50px;
            
            bottom: 500px;
        }
        .class2
        {   position: relative;
            background-color: red;
           
            padding: 50px;
            margin: 50px;
            top: 60px;
            
        }
        .class3
        {
            position: static;
            background-color: blueviolet;
            padding: 50px;
            margin: 50px;
        }
    </style>
   </head>
<body>
    <h1>this is heading</h1>
    <h2>heading</h2>
   <div class="container">
   <div class="class1">1</div>
   <div class="class2">2</div>
    <div class="class3">3</div>
</div>
</body>
</html>
