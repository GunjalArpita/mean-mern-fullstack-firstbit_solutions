<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
    <style>
        .gridbox{
            display: grid;
            row-gap: 50px;
            grid-template-columns: auto auto;
            column-gap: 50px;
            background-color: blue;
        }
        .griditems{
            background-color: antiquewhite;
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="gridbox">
        <div class="griditems">1</div>
        <div class="griditems">2</div>
        <div class="griditems">3</div>
        <div class="griditems">4</div>
    </div>
</body>
</html>
