<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>color property</title>
    <style>
        /*color using color name*/
        h3{
            color: aqua;
        }
        /*color using hex value*/
       p{
        color:#06f3fb;
       }
       /*color using rgb*/
       div{
        color: rgb(209, 121, 121);
       }

    </style>
</head>
<body>
    <h3>let's get started</h3>
    <p>hello everyone</p>
    <div>I am Arpita</div>

</body>
</html>
