<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>felxbox</title>
<style>
   .container> div{
        height: 50px;
        width: 50px;
        background-color: azure;
        margin: 5px;
        padding: 15px;

    }
    
    .container{
        background-color: tomato;
        /*dispaly must be flex */
        display: flex;
        flex-direction:row;
        height: 20vh;
        justify-content: space-evenly;
    }
    .con> div{
        height: 50px;
        width: 50px;
        background-color: azure;
        margin: 5px;
        padding: 15px;

    }
    .con{
        background-color: tomato;
        /*dispaly must be flex */
        display: flex;
        flex-direction:column;
        height: 80vh;
        justify-content:right;
    }
</style>

</head>
<body>
    <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>1</div>
    <div>2</div>
    <div>3</div>
</div>
<div class="con">
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
</div>
</body>
</html>
