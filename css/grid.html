<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Grid</title>

    <style>
        .container{
            background-color: yellowgreen;
            row-gap: 20px;
            column-gap: 5px;
            display: grid;
            /*2 auto means 2 columns*/
            grid-template-columns:  40px auto auto;
        }
        .items{
            background-color: aqua;
            border: 2px  solid red;
        }
    </style>
</head>
<body>
    <div class="container">
      <div class="items" style="grid-column: 1/3;">1</div>
      <div class="items">2</div>
      <div class="items">3</div>
      <div class="items">2</div>
      <div class="items">3</div>
      <div class="items">2</div>
      <div class="items">3</div>
      <div class="items">2</div>
      <div class="items">3</div>
      <div class="items" style="grid-row: 1/2;">4</div>
    </div>
</body>
</html>
